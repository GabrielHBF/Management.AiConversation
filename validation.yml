trigger: none

pr:
  branches:
    exclude:
      - main
    include:
      - '*'

pool:
  vmImage: 'ubuntu-22.04'

variables:
  MAJOR: '1'
  MINOR: '0'
  RELEASE: $(Build.BuildId)
  VERSION: "$(MAJOR).$(MINOR).$(RELEASE)" 

jobs:
- job: build
  displayName: 'Build & Tests'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK 10.0'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
  
  - task: NuGetAuthenticate@1
    displayName: Authenticate NuGet feed

  - task: DotNetCoreCLI@2
    displayName: Restore NuGet Packages
    inputs:
      command: 'restore'
      projects: 'src/management.IAConversations.slnx'
      feedsToUse: 'config'
      nugetConfigPath: 'nuget.config'

  - task: DotNetCoreCLI@2
    displayName: 'Check editorconfig compliance'
    inputs:
      command: 'custom'
      custom: 'format'
      arguments: '--verify-no-changes src/Management.IAConversations.slnx'

  - task: DotNetCoreCLI@2
    displayName: Run build 
    inputs:
      command: 'build'
      projects: 'src/Management.IAConversations.Api/Management.IAConversations.Api.csproj'

  - task: DotNetCoreCLI@2
    displayName: Run tests
    inputs:
      command: 'test'
      projects: 'src/Management.AiConversations.slnx'
      arguments: '--no-build --logger "trx;LogFileName=test-results.trx" --results-directory $(Agent.TempDirectory)/TestResults'
