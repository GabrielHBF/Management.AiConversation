name: PR Validation (Code Quality)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

jobs:
  quality-gate:
    name: Check Quality & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore src/Management.AiConversations.slnx

    - name: Verificação de Indentação (Lint)
      run: dotnet format src/Management.AiConversations.slnx --verify-no-changes --verbosity diagnostic

    - name: Build Check
      run: dotnet build src/Management.AiConversations.slnx --no-restore --configuration Release
